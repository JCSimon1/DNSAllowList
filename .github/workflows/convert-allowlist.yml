name: Convert Allow-list for AdGuard Home

on:
  push:
    branches:
      - main
    paths:
      - "Allow-list"
      - "scripts/convert_allowlist.py"
      - ".github/workflows/convert-allowlist.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    name: Generate AdGuard allowlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Convert Allow-list
        run: |
          python scripts/convert_allowlist.py

      - name: Check generated file
        run: |
          test -s Allow-list-AdGuard

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- Allow-list-AdGuard; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated AdGuard allowlist
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Allow-list-AdGuard

          git commit \
            -m "chore: update AdGuard allowlist"

          git push